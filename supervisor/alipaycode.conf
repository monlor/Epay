[program:alipaycode]
command=/bin/sh -c 'if [ -n "$ALIPAYCODE_CHANNEL" ]; then exec php /var/www/html/plugins/alipaycode/server.php "$ALIPAYCODE_CHANNEL"; else exec php /var/www/html/plugins/alipaycode/server.php; fi'
directory=/var/www/html/plugins/alipaycode
user=www-data
autostart=true
autorestart=true
startsecs=0
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
